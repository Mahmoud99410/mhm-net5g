name: Build MHM NET5G

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create . --platforms=android --project-name mhm_net5g --org com.mhm
      - name: Patch Android manifest (internet, cleartext, name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <application#' $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="MHM NET5G"#' $M
          cat $M
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Use fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk MHM-NET5G.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MHM-NET5G.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create . --platforms=windows,android --project-name mhm_net5g --org com.mhm
      - name: Patch window title
        shell: pwsh
        run: |
          $f = "windows/runner/main.cpp"
          (Get-Content $f) -replace 'L"mhm_net5g"', 'L"MHM NET5G"' | Set-Content $f
          $r = "windows/runner/Runner.rc"
          (Get-Content $r) -replace '"mhm_net5g"', '"MHM NET5G"' | Set-Content $r
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item build/windows/x64/runner/Release -Destination "MHM NET5G" -Recurse
          if (Test-Path "MHM NET5G/mhm_net5g.exe") { Rename-Item "MHM NET5G/mhm_net5g.exe" "MHM NET5G.exe" }
          Compress-Archive -Path "MHM NET5G" -DestinationPath MHM-NET5G-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MHM-NET5G-Windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MHM NET5G (latest build)
          body: |
            MHM NET5G - build ${{ github.run_number }}
            - MHM-NET5G.apk : Android
            - MHM-NET5G-Windows.zip : Windows (extract, run "MHM NET5G.exe")
          files: |
            out/android/MHM-NET5G.apk
            out/windows/MHM-NET5G-Windows.zip
          make_latest: true
